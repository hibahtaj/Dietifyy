<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calorie Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(to right, #fce4ec, #f3e5f5);
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      color: #d63384;
      font-weight: bold;
    }

    .card {
      background-color: #fff0f6;
      border: 2px solid #f8bbd0;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(223, 128, 255, 0.2);
    }

    .form-label {
      color: #6a1b9a;
      font-weight: 600;
    }

    .btn-primary {
      background-color: #ba68c8;
      border-color: #ab47bc;
    }

    .btn-primary:hover {
      background-color: #ce93d8;
      border-color: #ba68c8;
    }

    select, input[type="number"] {
      border-radius: 12px;
    }

    .form-check-label {
      color: #6a1b9a;
    }

    .form-check-input:checked {
      background-color: #d63384;
      border-color: #d63384;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">✨ Calorie Calculator ✨</h1>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <form action="{{ url_for('calorie_calculator') }}" method="POST">
            <div class="mb-3">
              <label class="form-label">Gender</label>
              <select class="form-select" name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="age" class="form-label">Age</label>
              <input type="number" class="form-control" id="age" name="age" required min="10" max="120">
            </div>

            <div class="mb-3">
              <label for="weight" class="form-label">Weight (kg)</label>
              <input type="number" step="0.1" class="form-control" id="weight" name="weight" required min="30" max="300">
            </div>

            <div class="mb-3">
              <label for="height" class="form-label">Height (cm)</label>
              <input type="number" class="form-control" id="height" name="height" required min="100" max="250">
            </div>

            <div class="mb-3">
              <label class="form-label">Activity Level</label>
              <select class="form-select" name="activity_level" required>
                <option value="sedentary">Sedentary (little or no exercise)</option>
                <option value="light">Light (exercise 1-3 days/week)</option>
                <option value="moderate">Moderate (exercise 3-5 days/week)</option>
                <option value="active">Active (exercise 6-7 days/week)</option>
                <option value="very_active">Very Active (hard exercise 6-7 days/week)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Diet Preference</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="preference" id="non-veg" value="non-veg" checked>
                <label class="form-check-label" for="non-veg">Non-Vegetarian</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="preference" id="veg" value="veg">
                <label class="form-check-label" for="veg">Vegetarian</label>
              </div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">💫 Calculate Calories 💫</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
