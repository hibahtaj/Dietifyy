<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Planner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">Diet Planner</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h3 class="card-title">Meal Planner</h3>
                        <p class="card-text">Generate a custom meal plan based on your preferences</p>
                        <a href="{{ url_for('meal_planner') }}" class="btn btn-primary">Go to Meal Planner</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h3 class="card-title">Calorie Calculator</h3>
                        <p class="card-text">Calculate your daily calorie needs</p>
                        <a href="{{ url_for('calorie_calculator') }}" class="btn btn-primary">Go to Calculator</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
