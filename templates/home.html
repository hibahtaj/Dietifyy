<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIETIFY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Top Bar -->
    <div class="container-fluid bg-white shadow-sm py-2">
        <div class="d-flex justify-content-between align-items-center px-4">
            <h2 class="mb-0 fw-bold text-primary">DIETIFY</h2>
            <div>
                <span class="me-2 text-muted">Reach us at:</span>
                <a href="#" class="text-dark me-3"><i class="fab fa-instagram fa-lg"></i></a>
                <a href="#" class="text-dark"><i class="fab fa-facebook fa-lg"></i></a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container py-5">
        <h1 class="text-center mb-4">Diet Planner</h1>
        
        <div class="row justify-content-center">
            <!-- Meal Planner -->
            <div class="col-md-6 mb-4">
                <div class="card p-4">
                    <h3 class="text-center">Meal Planner</h3>
                    <p class="text-center">Generate a custom meal plan based on your preferences</p>
                    <form action="{{ url_for('meal_planner') }}" method="get">
                        <div class="mb-3">
                            <input type="number" name="calories" class="form-control" placeholder="Enter your daily calorie goal" required>
                        </div>
                        <div class="mb-3">
                            <select class="form-select" name="preference" required>
                                <option value="" disabled selected>Select Diet Preference</option>
                                <option value="veg">Vegetarian</option>
                                <option value="non-veg">Non-Vegetarian</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Generate Meal Plan</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Calorie Calculator -->
            <div class="col-md-6 mb-4">
                <div class="card p-4 text-center">
                    <h3>Calorie Calculator</h3>
                    <p>Calculate your daily calorie needs</p>
                    <a href="{{ url_for('calorie_calculator') }}" class="btn btn-primary">Go to Calculator</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
