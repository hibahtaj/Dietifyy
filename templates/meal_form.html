<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Meal Planner</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form action="{{ url_for('meal_planner') }}" method="POST">
                            <div class="mb-3">
                                <label for="calories" class="form-label">Daily Calories</label>
                                <input type="number" class="form-control" id="calories" name="calories" value="{{ request.args.get('calories', '2000') }}" min="1000" max="5000" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Diet Preference</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="preference" id="non-veg" value="non-veg" {{ 'checked' if request.args.get('preference', 'non-veg') == 'non-veg' else '' }}>
                                    <label class="form-check-label" for="non-veg">Non-Vegetarian</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="preference" id="veg" value="veg" {{ 'checked' if request.args.get('preference') == 'veg' else '' }}>
                                    <label class="form-check-label" for="veg">Vegetarian</label>
                                </div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Generate Meal Plan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
