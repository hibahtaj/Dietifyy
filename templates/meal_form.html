<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Custom Purple & Pink Theme */
        body {
            background-color: #f4c6e0; /* Soft pink background */
        }

        .container {
            background-color: #ffffff; /* White container to contrast the pink */
            border-radius: 10px;
            padding: 30px;
        }

        h1 {
            color: #9c27b0; /* Purple title */
        }

        .card {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-body {
            background-color: #fce4ec; /* Lighter pink background for the card */
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #e91e63; /* Stronger pink border */
            box-shadow: inset 0 0 5px rgba(233, 30, 99, 0.3); /* Pink shadow */
        }

        .form-control:focus {
            border-color: #e91e63; /* Pink focus border */
            box-shadow: 0 0 5px rgba(233, 30, 99, 0.5); /* Brighter pink focus effect */
        }

        .form-check-label {
            color: #9c27b0; /* Purple color for labels */
        }

        .btn-primary {
            background-color: #9c27b0; /* Purple button */
            border-color: #9c27b0;
        }

        .btn-primary:hover {
            background-color: #7b1fa2; /* Darker purple on hover */
            border-color: #7b1fa2;
        }

        .btn-secondary {
            background-color: #e91e63; /* Strong pink for secondary button */
            border-color: #e91e63;
        }

        .btn-secondary:hover {
            background-color: #d81b60; /* Darker pink on hover */
            border-color: #d81b60;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Meal Planner</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form action="{{ url_for('meal_planner') }}" method="POST">
                            <div class="mb-3">
                                <label for="calories" class="form-label">Daily Calories</label>
                                <input type="number" class="form-control" id="calories" name="calories" value="{{ request.args.get('calories', '2000') }}" min="1000" max="5000" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Diet Preference</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="preference" id="non-veg" value="non-veg" {{ 'checked' if request.args.get('preference', 'non-veg') == 'non-veg' else '' }}>
                                    <label class="form-check-label" for="non-veg">Non-Vegetarian</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="preference" id="veg" value="veg" {{ 'checked' if request.args.get('preference') == 'veg' else '' }}>
                                    <label class="form-check-label" for="veg">Vegetarian</label>
                                </div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Generate Meal Plan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
