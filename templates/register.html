<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dietify • Register</title>
  <style>
    body {
      background-color: lavenderblush;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column; 
    }

    .dietify-title {
      font-size: 3rem; 
      font-weight: bold;
      color: #DA70D6;
      margin-bottom: 20px; 
    }

    .register-box {
      background-color: white;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    h1 {
      color: #DA70D6;
      margin-bottom: 10px;
    }

    .flash {
      color: crimson;
      font-size: 14px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1.5px solid #eecde3;
      font-size: 15px;
    }

    button {
      background-color: #DA70D6;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #C71585;
    }

    a {
      color: #DA70D6;
      font-weight: bold;
      text-decoration: none;
    }

    .extra-text {
      margin-top: 20px;
      font-size: 13px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="dietify-title">Dietify</div> 
  <div class="register-box">
    <h1>Register 🎀</h1>
    <p>Create your Dietify journey!</p>

    {% if error %}
      <p class="flash">{{ error }}</p>
    {% endif %}

    <form action="/register" method="POST">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Sign me up 💫</button>
    </form>

    <div class="extra-text">
      Already have an account?<br>
      <a href="/login">Login here 🌈</a>
    </div>
  </div>
</body>
</html>
